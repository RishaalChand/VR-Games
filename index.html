<!doctype html>
<html>
<head>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>
  <a-scene>

    <!-- Camera so the user can look around -->
    <a-entity camera position="0 1.6 0"></a-entity>

    <a-box
      position="-1 1 -3"
      color="red">
    </a-box>

    <a-sphere
      position="1 1 -4"
      color="blue">
    </a-sphere>

    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="10"
      height="10"
      color="#DDDDDD">
    </a-plane>

    <a-sky color="#EEEEEE"></a-sky>

  </a-scene>
</body>
</html>
