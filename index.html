<!doctype html>
<html>
<head>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <script>
    AFRAME.registerComponent('click-alert', {
      init: function () {
        this.el.addEventListener('click', () => {
          alert('You clicked: ' + this.el.id);
        });
      }
    });
  </script>
</head>

<body>
  <a-scene>

    <!-- Player camera -->
    <a-entity 
      id="player"
      camera
      wasd-controls
      look-controls
      position="0 1.6 2">
    </a-entity>

    <!-- Floor (big enough for a room) -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#CCCCCC">
    </a-plane>

    <!-- Table -->
    <a-box
      id="table"
      position="0 0.75 -3"
      width="2"
      height="0.5"
      depth="1"
      color="#8B4513"
      click-alert>
    </a-box>

    <!-- Bench -->
    <a-box
      id="bench"
      position="-2 0.5 -3"
      width="1.5"
      height="0.4"
      depth="0.6"
      color="#654321"
      click-alert>
    </a-box>

    <!-- Secret Book (on table) -->
    <a-box
      id="secret-book"
      position="0.3 1.05 -3"
      width="0.3"
      height="0.1"
      depth="0.4"
      color="green"
      click-alert>
    </a-box>

    <!-- Red Box (on table) -->
    <a-box
      id="red-box"
      position="-0.6 1.05 -3"
      width="0.5"
      height="0.5"
      depth="0.5"
      color="red"
      click-alert>
    </a-box>

    <!-- Blue Sphere (on floor) -->
    <a-sphere
      id="blue-sphere"
      position="1 0.7 -4"
      radius="0.7"
      color="blue"
      click-alert>
    </a-sphere>

    <!-- Sky -->
    <a-sky color="#EEEEEE"></a-sky>

  </a-scene>
</body>
</html>
