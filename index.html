<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Escape Room Test</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <script>
    // Click handler for all clickable objects.
    AFRAME.registerComponent('click-message', {
      schema: { text: { type: 'string', default: '' } },
      init: function () {
        let timer;
        this.el.addEventListener('click', () => {
          const hud = document.querySelector('#hud');
          hud.setAttribute('value', this.data.text || ('You clicked: ' + this.el.id));
          clearTimeout(timer);
          timer = setTimeout(() => hud.setAttribute('value', ''), 2000);
        });
      }
    });
  </script>
</head>

<body>
  <a-scene>

    <!-- CAMERA RIG (correct height) -->
    <a-entity id="rig" position="0 0 2">
      <a-entity camera look-controls wasd-controls>
        
        <!-- Cursor -->
        <a-entity
          cursor="fuse: false"
          raycaster="objects: .clickable"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
          material="color: black; shader: flat">
        </a-entity>

        <!-- HUD TEXT (moved further away to avoid distortion) -->
        <a-text
          id="hud"
          value=""
          align="center"
          color="#111"
          width="2"
          position="0 -0.4 -1.5">
        </a-text>

      </a-entity>
    </a-entity>

    <!-- FLOOR -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#CCCCCC">
    </a-plane>

    <!-- TABLE (correct height: 0.8 total) -->
    <a-box
      id="table"
      class="clickable"
      position="0 0.8 -3"
      width="2"
      height="0.1"
      depth="1"
      color="#8B4513"
      click-message>
    </a-box>

    <!-- TABLE LEGS (correctly aligned under table) -->
    <a-box position="-0.9 0.35 -3.45" width="0.1" height="0.7" depth="0.1" color="#6B3410"></a-box>
    <a-box position="0.9 0.35 -3.45"  width="0.1" height="0.7" depth="0.1" color="#6B3410"></a-box>
    <a-box position="-0.9 0.35 -2.55" width="0.1" height="0.7" depth="0.1" color="#6B3410"></a-box>
    <a-box position="0.9 0.35 -2.55"  width="0.1" height="0.7" depth="0.1" color="#6B3410"></a-box>

    <!-- BENCH (correct height) -->
    <a-box
      id="bench"
      class="clickable"
      position="-2 0.2 -3"
      width="1.5"
      height="0.4"
      depth="0.6"
      color="#654321"
      click-message>
    </a-box>

    <!-- SECRET BOOK (correct height: table top 0.8 + half book height 0.05 = 0.85) -->
    <a-box
      id="secret-book"
      class="clickable"
      position="0.3 0.85 -3"
      width="0.3"
      height="0.1"
      depth="0.4"
      color="green"
      click-message>
    </a-box>

    <!-- RED BOX (correct height: table top 0.8 + half box height 0.25 = 1.05) -->
    <a-box
      id="red-box"
      class="clickable"
      position="-0.6 1.05 -3"
      width="0.5"
      height="0.5"
      depth="0.5"
      color="red"
      click-message>
    </a-box>

    <!-- BLUE SPHERE (moved away from table, sits correctly on floor) -->
    <a-sphere
      id="blue-sphere"
      class="clickable"
      position="2 0.7 -4"
      radius="0.7"
      color="blue"
      click-message>
    </a-sphere>

    <a-sky color="#EEEEEE"></a-sky>

  </a-scene>
</body>
</html>
