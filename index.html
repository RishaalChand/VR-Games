<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Escape Room Test</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <script>
    // Simple click handler for all clickable objects
    AFRAME.registerComponent('click-alert', {
      init: function () {
        this.el.addEventListener('click', () => {
          console.log('Clicked:', this.el.id);
          alert('You clicked: ' + this.el.id);
        });
      }
    });
  </script>
</head>

<body>
  <a-scene>

    <!-- Camera rig: moves with WASD, contains camera + cursor -->
    <a-entity id="rig" wasd-controls position="0 1.6 2">
      <!-- Camera (VR headset controls rotation) -->
      <a-entity camera look-controls>
        <!-- Cursor in the center of view for clicking in VR -->
        <a-entity
          cursor="fuse: false"
          raycaster="objects: .clickable"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
          material="color: black; shader: flat">
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- Floor -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#CCCCCC">
    </a-plane>

    <!-- Table -->
    <a-box
      id="table"
      class="clickable"
      position="0 0.75 -3"
      width="2"
      height="0.5"
      depth="1"
      color="#8B4513"
      click-alert>
    </a-box>

    <!-- Bench -->
    <a-box
      id="bench"
      class="clickable"
      position="-2 0.5 -3"
      width="1.5"
      height="0.4"
      depth="0.6"
      color="#654321"
      click-alert>
    </a-box>

    <!-- Secret Book (on table) -->
    <a-box
      id="secret-book"
      class="clickable"
      position="0.3 1.05 -3"
      width="0.3"
      height="0.1"
      depth="0.4"
      color="green"
      click-alert>
    </a-box>

    <!-- Red Box (on table) -->
    <a-box
      id="red-box"
      class="clickable"
      position="-0.6 1.05 -3"
      width="0.5"
      height="0.5"
      depth="0.5"
      color="red"
      click-alert>
    </a-box>

    <!-- Blue Sphere (on floor) -->
    <a-sphere
      id="blue-sphere"
      class="clickable"
      position="1 0.7 -4"
      radius="0.7"
      color="blue"
      click-alert>
    </a-sphere>

    <!-- Sky -->
    <a-sky color="#EEEEEE"></a-sky>

  </a-scene>
</body>
</html>
